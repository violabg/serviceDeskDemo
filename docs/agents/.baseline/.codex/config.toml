# Generated from .vscode/mcp.json and approved Codex overrides in the answers file.
# Regenerate: uv run .agents/scripts/check-agent-system.py --sync-mcp
# Other user/plugin MCP servers are inherited. Credentials are never stored here.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp"
bearer_token_env_var = "GITHUB_TOKEN"

[mcp_servers.neon]
url = "https://mcp.neon.tech/sse"

[mcp_servers.next-devtools]
command = "npx"
args = ["next-devtools-mcp@0.3.6"]
