capabilities:
  repository-search:
    resolution: native-tool
    tool: search/textSearch, search/fileSearch, search/usages
    note: Resolve per role from PLATFORM_TOOLS. Bounded listDirectory/usages followed
      by readFile when textSearch is not declared; no source MCP or root registry
      required.
  file-editing:
    resolution: native-tool
    tool: read/readFile, edit/createFile, edit/editFiles
    note: Canonical role tool surfaces preserved.
  terminal-execution:
    resolution: native-tool
    tool: execute/runInTerminal
    note: Required validation commands are available to execution roles.
  knowledge-retrieval:
    resolution: fallback
    tool: read/readFile
    note: Read the curated repository knowledge index and selected documents.
  agent-session-persistence:
    resolution: fallback
    tool: read/readFile and edit/createFile
    note: Persist session memory, session log, execution report, and derived planning
      artifacts under sessions/<planning-session-id>/.
  work-item-retrieval:
    resolution: user-supplied
    tool: mcp_github_mcp_s2_issue_read
    note: Planner-only read access for the current GitHub issue.
    verification: 'blocked: legacy exact name not exposed in current tools; configured
      github/* does not prove an equivalent issue-and-comments binding'
  visual-evidence:
    resolution: native-tool
    tool: view_image, screenshot_page, open_browser_page
    note: demo-vision captures deterministic session-local evidence.
    verification: 'unknown: existing Vision declares edit tools only; image intake/delegation
      not exercised during maintenance'
  subagent-delegation:
    resolution: native-tool
    tool: agent
    note: Existing Copilot agent/runSubagent invocation retained, with bounded inline
      fallback for gathering and knowledge discovery when unavailable.
  web-documentation:
    resolution: fallback
    tool: none
    note: Require authoritative excerpts when external documentation is needed.
  test-plan-schema:
    resolution: fallback
    tool: read/readFile
    path: docs/agents/test-plan-schema.md
    note: Lab-authored local YAML schema; fields and lifecycle statically checked
      against Integration Tester.
