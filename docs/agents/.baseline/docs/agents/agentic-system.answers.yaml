# Machine-readable record of the approved Bootstrap decisions. Do not hand-edit
# without also refreshing docs/agents/.baseline/ and the manifest.
version: 1

bootstrap:
  skill_version: 3.4.0
  contract_applied_through: 3.4.0
  generated_on: 2026-08-03

platform:
  target: github-copilot
  agent_root: .github/agents
  skill_root: .github/skills
  instruction_root: .github/instructions

slots:
  AGENT_PREFIX:
    value: demo-
    source: user
    evidence: User supplied demo during Bootstrap intake.
  TARGET_PLATFORM:
    value: github-copilot
    source: user
    evidence: User selected GitHub Copilot; .vscode/mcp.json supports the choice.
  VISION_AGENT_NAME:
    value: demo-vision
    source: recommend-accepted
    evidence: User selected visual support with the approved demo- prefix.
  TRACKER_ADAPTER:
    value: GitHub Issues
    source: user
    evidence: User selected GitHub issue read only; origin is github.com.
  WORK_ITEM_RETRIEVAL:
    value: mcp_github_mcp_s2_issue_read
    source: user
    evidence: User approved planner issue read only.
  LOCAL_MARKDOWN_TRACKER_CONTRACT:
    value: no fallback; block when GitHub retrieval is unavailable
    source: user
    evidence: User selected no fallback.
  WORK_ITEM_ID_FORMAT:
    value: violabg/serviceDeskDemo#<number>
    source: user
    evidence: User selected repository-qualified GitHub IDs.
  SESSION_ROOT:
    value: sessions
    source: user
    evidence: User approved the existing sessions model.
  SESSION_ACTIVATION:
    value: Start from a supplied External Issue ID and stay scoped to it until closed.
    source: recommend-accepted
    evidence: GitHub issue planning contract.
  SESSION_ARTIFACT_STORAGE:
    value: sessions/<planning-session-id>/
    source: user
    evidence: User approved isolated session folders.
  KNOWLEDGE_SOURCE:
    value: docs/agents/knowledge/README.md and selected knowledge documents
    source: discovery
    evidence: Existing curated knowledge index.
  KNOWLEDGE_INDEX_PATH:
    value: docs/agents/knowledge/README.md
    source: user
    evidence: User selected the existing index.
  CONTEXT_GLOSSARY_PATH:
    value: CONTEXT.md
    source: user
    evidence: User approved a root glossary.
  PLAN_SCHEMA_PATH:
    value: docs/agents/plan-schema.md
    source: user
    evidence: User selected docs/agents.
  ARTIFACT_GATES_PATH:
    value: docs/agents/artifact-gates.md
    source: user
    evidence: User selected docs/agents.
  VALIDATION_COMMANDS:
    value: pnpm agent:lint-artifacts, pnpm lint, pnpm typecheck, pnpm test, pnpm build
    source: user
    evidence: User approved repository validation set from package.json.
  REPOSITORY_SEARCH_TOOL:
    value: built-in bounded Copilot search tools
    source: user
    evidence: User approved text search, file search, and usages.
  APPROVED_MCP_TOOLS:
    value: role-specific existing MCP and editor tools; planner and knowledge-builder custom surfaces preserved, no new tools added
    source: user
    evidence: Approved 3.4.0 upgrade preserves the manifest customization register and existing least-privilege tool assignments.
  VISUAL_EVIDENCE_STRATEGY:
    value: demo-vision with session-local PNG evidence and Markdown notes
    source: user
    evidence: User selected demo-vision for this UI repository.
  VISUAL_ARTIFACT_FORMAT:
    value: PNG capture paired with a short Markdown note
    source: user
    evidence: User approved visual evidence strategy.
  VISUAL_ARTIFACT_STORAGE:
    value: sessions/<planning-session-id>/visual/
    source: recommend-accepted
    evidence: User selected session-local visual support.
  REPO_KNOWLEDGE_PATHS:
    value: docs/ and CONTEXT.md
    source: discovery
    evidence: Existing docs and generated glossary.
  TEST_STACK_CONVENTIONS:
    value: Vitest, Testing Library, jest-dom, Node environment, cleanup after each test
    source: discovery
    evidence: package.json, vitest.config.ts, and test/setup.ts.
  INTEGRATION_TEST_SCOPE:
    value: Internal wiring with third-party boundaries stubbed; exclude unit-only, browser E2E, and live vendor services.
    source: user
    evidence: User selected internal wiring scope.
  OUTPUT_LANGUAGE:
    value: English
    source: user
    evidence: User selected English.
  AGENT_ROOT:
    value: .github/agents
    source: user
    evidence: User approved standard GitHub Copilot locations.
  SKILL_ROOT:
    value: .github/skills
    source: user
    evidence: User approved standard GitHub Copilot locations.
  INSTRUCTION_ROOT:
    value: .github/instructions
    source: user
    evidence: User approved standard GitHub Copilot locations.
  MANIFEST_PATH:
    value: docs/agents/agentic-system-manifest.md
    source: user
    evidence: User approved docs/agents maintenance root.
  KNOWLEDGE_FILE_GLOB:
    value: docs/agents/knowledge/**/*.md
    source: discovery
    evidence: Existing knowledge index directory.

capabilities:
  repository-search:
    resolution: native-tool
    tool: search/textSearch, search/fileSearch, search/usages
    note: Built-in Copilot search is approved.
  file-editing:
    resolution: native-tool
    tool: read/readFile, edit/createFile, edit/editFiles
    note: Canonical role tool surfaces preserved.
  terminal-execution:
    resolution: native-tool
    tool: execute/runInTerminal
    note: Required validation commands are available to execution roles.
  knowledge-retrieval:
    resolution: fallback
    tool: read/readFile
    note: Read the curated repository knowledge index and selected documents.
  agent-session-persistence:
    resolution: fallback
    tool: read/readFile and edit/createFile
    note: Persist session memory, session log, execution report, and derived planning artifacts under sessions/<planning-session-id>/.
  work-item-retrieval:
    resolution: user-supplied
    tool: mcp_github_mcp_s2_issue_read
    note: Planner-only read access for the current GitHub issue.
  visual-evidence:
    resolution: native-tool
    tool: view_image, screenshot_page, open_browser_page
    note: demo-vision captures deterministic session-local evidence.
  subagent-delegation:
    resolution: native-tool
    tool: agent
    note: Canonical agent delegation surface preserved.
  web-documentation:
    resolution: fallback
    tool: none
    note: Require authoritative excerpts when external documentation is needed.

