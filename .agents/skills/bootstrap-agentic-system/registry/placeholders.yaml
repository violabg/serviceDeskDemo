# Generated from system/registry/. Do not edit by hand.
# Single source of truth for Personalization Slots.
#
# Consumed by scripts/render-public-templates.ts and
# scripts/validate-canonical-template-mirrors.ts, and rendered into the
# Bootstrap skill's registry/ folder at export time so Bootstrap can run the
# decision register inside the target repository.
#
# kind:
#   value - inline `{{NAME}}` substitution
#   block - `<!-- CANONICAL-TEMPLATE-SLOT: NAME START ... -->` block
#   both  - used in both forms
#
# recommend  - the default proposal Bootstrap states when it asks the question.
# infer_from - target-repository evidence Bootstrap inspects before proposing.
#
# A recommendation is never an approval. Bootstrap may group evidence-backed
# routine defaults for approval; only unresolved material choices need questions.

placeholders:
  - name: AGENT_PREFIX
    kind: value
    question: Which prefix should every generated custom agent name carry?
    fill_from: user
    recommend: A short slug derived from the repository name, for example `shop-` for `shop-api`.
    infer_from:
      - repository folder name
      - existing agent file names under .github/agents/, .claude/agents/, or .cursor/rules/

  - name: TARGET_PLATFORM
    kind: value
    question: Which selected environment does this generated copy target?
    fill_from: user
    recommend: Use the explicitly selected environment ID from the multi-select intake. Keep a per-file value when environments differ; never select from folder presence or the execution host.
    infer_from:
      - explicit selected environments and their client/version evidence
      - existing customization folders as evidence only, not selection

  - name: TRACKER_ADAPTER
    kind: both
    question: Which work-item tracker adapter should generated planning skills use?
    fill_from: discovery
    capability: work-item-retrieval
    recommend: GitHub Issues when the origin remote is github.com and issue templates exist; otherwise the local Markdown adapter.
    infer_from:
      - git remote origin host
      - .github/ISSUE_TEMPLATE/
      - Jira, Linear, or Azure Boards references in CONTRIBUTING.md or PR templates
      - existing Markdown issue folder such as docs/issues/

  - name: LOCAL_MARKDOWN_TRACKER_CONTRACT
    kind: both
    question: When no external tracker exists, which local Markdown issue contract applies?
    fill_from: user
    recommend: "`{{RUNTIME_ROOT}}/issues/<external-issue-id>.md` with front matter carrying id, type, title, and status; keep an existing Markdown issue folder in place when one exists."
    infer_from:
      - existing Markdown issue, story, or ticket folders
      - front matter fields already used by those files

  - name: WORK_ITEM_RETRIEVAL
    kind: both
    question: Which exact read-only tools or procedures return work items, comments, and linked-item titles as Markdown?
    fill_from: user
    capability: work-item-retrieval
    recommend: Approve only the selected adapter's single-item, comment, and batch-ID retrieval operations needed by the selected role. Bind them to Markdown output that preserves code blocks and image URLs; normalize source HTML inside the approved adapter when necessary. The local Markdown contract may supply an approved batch file-read procedure. No search or write tools.
    infer_from:
      - configured MCP servers in .vscode/mcp.json, .mcp.json, or .cursor/mcp.json
      - tracker chosen for TRACKER_ADAPTER
      - selected planning skill's Markdown output fields and batch-title-resolution requirements
      - verified adapter output formats and exact single-item, comment, and batch operations

  - name: WORK_ITEM_WRITE
    kind: both
    question: Which exact tools or procedures may manage-work-item use to create work items and update existing ones?
    fill_from: user
    capability: work-item-write
    recommend: Approve only the selected adapter's create and field-update operations, plus add-comment when the team wants update notes. No delete, bulk-edit, search, or administrative tools. For the local Markdown adapter, approve writing one item file under the contract path. When no working write binding exists, skip or defer manage-work-item instead of generating a skill that cannot write.
    infer_from:
      - configured MCP servers in .vscode/mcp.json, .mcp.json, or .cursor/mcp.json
      - tracker chosen for TRACKER_ADAPTER
      - the selected client's verified tool list and permissions for that tracker integration

  - name: SESSION_ACTIVATION
    kind: block
    question: How is a planning session activated in the target repository?
    fill_from: user
    recommend: A planning session starts when the user supplies an External Issue ID, and stays scoped to that ID until it is closed.
    infer_from:
      - existing session, worklog, or planning folders
      - branch naming convention in recent git history

  - name: SESSION_ARTIFACT_STORAGE
    kind: block
    question: Where are planning session artifacts stored?
    fill_from: user
    recommend: "`{{SESSION_ROOT}}/<planning-session-id>/`, one folder per session, artifacts never written outside it."
    infer_from:
      - resolved SESSION_ROOT
      - existing artifact folders under docs/

  - name: SESSION_ROOT
    kind: value
    question: What is the planning session root path?
    fill_from: user
    recommend: "`{{RUNTIME_ROOT}}/sessions`, unless the repository already has an established session root."
    infer_from:
      - presence and layout of docs/
      - existing generated or agent-owned folders

  - name: KNOWLEDGE_SOURCE
    kind: both
    question: Where do generated agents read repository knowledge from?
    fill_from: discovery
    capability: knowledge-retrieval
    recommend: Start with the knowledge documents listed in the generated knowledge index, read through the file-reading capability. When a selected role needs index rebuild or wiki catalog, page-listing, or page-reading operations, resolve the approved source and procedure for each evidenced operation within that role's scope.
    infer_from:
      - docs/, ADR folders, CONTEXT.md, architecture sections of README.md
      - any knowledge or documentation MCP server in the platform config
      - selected role's knowledge-index-rebuild and wiki capability evidence

  - name: KNOWLEDGE_INDEX_PATH
    kind: both
    question: What is the generated knowledge index path?
    fill_from: user
    recommend: "`knowledge/knowledge-index.md` at the project root; project knowledge only, excluding installation and maintenance material."
    infer_from:
      - existing top-level knowledge/ and its project documentation sources

  - name: CONTEXT_GLOSSARY_PATH
    kind: both
    question: What is the context glossary path?
    fill_from: user
    recommend: The existing `CONTEXT.md` or `GLOSSARY.md` when present; otherwise `CONTEXT.md` at the project root; never place domain vocabulary in the maintenance area.
    infer_from:
      - CONTEXT.md, GLOSSARY.md, docs/glossary.md

  - name: PLAN_SCHEMA_PATH
    kind: both
    question: What is the implementation plan schema path?
    fill_from: user
    recommend: "`{{RUNTIME_ROOT}}/schemas/plan-schema.md`, a runtime resource outside knowledge and maintenance roots."
    infer_from:
      - approved runtime resource root outside knowledge and maintenance areas

  - name: TEST_PLAN_SCHEMA_PATH
    kind: value
    question: Which compatible test-plan schema should the Integration Tester use?
    fill_from: discovery
    recommend: Use an existing compatible repository schema; otherwise install templates/test-plan-schema.md at `{{RUNTIME_ROOT}}/schemas/test-plan-schema.md`.
    infer_from:
      - existing test-plan schemas and test workflow documentation
      - selected Integration Tester contract and resolved PLAN_SCHEMA_PATH folder

  - name: PLATFORM_TOOLS
    kind: value
    question: Which verified tool names implement this role in this selected environment and execution context?
    fill_from: discovery
    recommend: Resolve source baseline operations to exact discovered tools for this environment and role; source names are not target defaults. Emit quoted YAML list items, or no items when approved manual fallbacks cover the role. Never mix different clients' names in one filled copy.
    infer_from:
      - matching Baseline Tool Surface row in templates/agent-role-contracts.md
      - official documentation for the selected client/version
      - effective role-level tools, permissions, and existing agent declarations

  - name: QUESTION_TOOL
    kind: value
    question: How does this platform collect user answers?
    fill_from: discovery
    recommend: Use the verified question tool or coordinator route for this execution context; use plain chat only when this role can interact with the user.
    infer_from:
      - target question tools and existing agent instructions

  - name: WORK_ITEM_GATHERING
    kind: value
    question: How should work-item evidence gathering run?
    fill_from: discovery
    capability: subagent-delegation
    recommend: Delegate the following gathering task through this environment's verified tool schema and default-agent invocation; never infer a registered name or selector from the word default. Use an approved inline procedure when delegation is unavailable. Preserve retrieval scope and artifact output, and keep other clients' syntax out of this value.
    infer_from:
      - target delegation tools and supported arguments
      - approved tracker adapter and capability bindings

  - name: KNOWLEDGE_DISCOVERY_DELEGATION
    kind: value
    question: How should bounded knowledge discovery run?
    fill_from: discovery
    capability: subagent-delegation
    recommend: Run up to 10 default subagents through this environment's verified default invocation within its concurrency limit; do not invent a named delegate. Use an approved sequential inline procedure for the same bounded discovery tasks when delegation is unavailable.
    infer_from:
      - target delegation tools and concurrency limits

  - name: IMAGE_INSPECTION
    kind: value
    question: How does this role inspect images in this selected environment?
    fill_from: discovery
    capability: visual-evidence
    recommend: For each local image or remote issue image URL, fetch the bytes with approved access (including private repository authentication when needed) and inspect the image with this role's own verified image-capable tools. Only when the user approved a cheaper vision-capable model for image inspection, or this role cannot read images in this environment, delegate the inspection through this environment's verified default-subagent invocation with that exact model; never invent a named delegate or model. If the image is unreadable, request it from the user; do not make image-dependent claims from its URL. Introduce the following evidence task in the replacement instruction.
    infer_from:
      - selected client's image input support for the role and execution context
      - target delegation tools and whether they accept a model choice
      - user-approved image-inspection model, if any

  - name: ROLE_HANDOFF
    kind: value
    question: After plan approval, how does the user start Implementor in a new conversation with the Planning Session ID in this environment?
    fill_from: discovery
    capability: role-selection
    recommend: "Tell the user to start Implementor in a new conversation with fresh context and print the exact step for this environment with the approved Planning Session ID filled in: the verified start command with an initial prompt where the client supports one, otherwise the steps to open a new conversation, select or enter the Implementor entrypoint, and paste `Resume implementation for Planning Session <planning-session-id>`. With an approved dual route, show both steps and label which one enforces Implementor's tool limits. Never continue implementation in the planning conversation, and keep other clients' syntax out of this value."
    infer_from:
      - verified Implementor entrypoint for this environment
      - client support for starting a session with an initial prompt
      - approved SESSION_ROOT and Planning Session ID format

  - name: ROLE_ACTIVATION
    kind: both
    question: How does a role-bound skill make sure it runs under its required role in this environment?
    fill_from: discovery
    capability: role-selection
    recommend: "With native main-session role selection, run the skill only when the conversation is already working as the required role; otherwise stop and tell the user the exact step to start that role. With a role-entry adapter, load the required role's entry first when the conversation is not already working as that role, then continue with the skill. With an approved dual route, accept a role started by either route; otherwise stop and show both start steps, with the enforced route first. Record whether tool limits are runtime-enforced or instruction-only."
    infer_from:
      - verified role entrypoints for this environment
      - approved dual-route decision per client surface
      - selected client's skill invocation and main-session agent selection documentation

  - name: CLIENT_GUIDE_ROOT
    kind: value
    question: Where should the user-facing guides for each selected environment live?
    fill_from: user
    recommend: "`docs/agentic-system/`, holding `README.md` plus one `<environment-id>.md` per selected environment. Exclude it from knowledge indexing and runtime loading; keep an existing documentation folder convention when one exists."
    infer_from:
      - existing docs/ layout and documentation site configuration
      - approved knowledge, runtime, and maintenance roots

  - name: ARTIFACT_GATES_PATH
    kind: both
    question: What is the artifact and gate conventions path?
    fill_from: user
    recommend: "`{{RUNTIME_ROOT}}/artifact-gates.md`, beside the other runtime contracts."
    infer_from:
      - resolved PLAN_SCHEMA_PATH folder

  - name: VALIDATION_COMMANDS
    kind: both
    question: Which commands validate a change in the target repository?
    fill_from: discovery
    capability: terminal-execution
    recommend: The lint, typecheck, test, and build commands the CI workflow runs, in the same order.
    infer_from:
      - package.json scripts, Makefile targets, pyproject.toml, build.gradle, *.csproj
      - CI workflow steps under .github/workflows/
      - CONTRIBUTING.md validation section

  - name: APPROVED_MCP_TOOLS
    kind: value
    question: Which exact MCP or platform tool names are approved for this generated role?
    fill_from: user
    recommend: Start with the `tooling_intent` categories in this role's capability sidecar and audit its `capabilities` tokens. Match each target capability category to tools or services already configured for the target repository, its tracker and knowledge sources, and its dependency stack; add only exact, least-privilege names approved for this role. Leave empty when no candidate is approved.
    infer_from:
      - tooling_intent categories in the selected templates/agents/<role>.capabilities.yaml sidecar
      - capabilities tokens in the selected templates/agents/<role>.capabilities.yaml sidecar
      - .vscode/mcp.json, .mcp.json, .cursor/mcp.json
      - tool lists in existing agent files
      - existing repository skills and their supported operations
      - package manifests and lockfiles that identify framework, library, cloud, or API documentation needs

  - name: CAPABILITY_BINDINGS
    kind: both
    question: Which approved binding performs each capability token this generated role uses?
    fill_from: discovery
    recommend: One Markdown table row per token listed in this role's capability sidecar, as `| `#capability:<token>` | <binding> |`. Start from the sidecar's `substitute` text, fill its slot values, and replace every reference to the Bootstrap registry with the concrete approved tool, repository path, or fallback procedure. Never cite Bootstrap or maintenance files, source services, or tools of another environment.
    infer_from:
      - capabilities entries in the selected templates/agents/<role>.capabilities.yaml sidecar
      - approved capability resolutions and fallbacks in the decision register
      - approved PLATFORM_TOOLS, APPROVED_MCP_TOOLS, WORK_ITEM_RETRIEVAL, SESSION_ROOT, and schema paths for this role

  - name: REPOSITORY_SEARCH_TOOL
    kind: both
    question: Which tool performs bounded repository search on the target platform?
    fill_from: discovery
    capability: repository-search
    recommend: Use a verified bounded search binding for this environment and role; native workspace file/path and text search are a valid fallback when cluster-aware repository search is absent. Record actual filenames and observed terms, not invented clusters. The capability registry has no platform tool defaults.
    infer_from:
      - resolved TARGET_PLATFORM
      - search tools referenced by existing agent files

  - name: VISUAL_EVIDENCE_STRATEGY
    kind: block
    question: How is visual evidence captured and reviewed?
    fill_from: user
    capability: visual-evidence
    recommend: Skip visual evidence unless the repository ships UI code or already stores screenshots and mockups.
    infer_from:
      - UI folders, component libraries, or frontend frameworks in the dependency manifest
      - existing screenshot, mockup, or design folders
      - Playwright, Cypress, or visual regression config

  - name: REPO_DOMAIN_TERMS
    kind: block
    question: Which repository domain terms should replace the mirror's example vocabulary?
    fill_from: discovery
    recommend: The recurring domain nouns of the codebase, taken from the glossary when one exists, otherwise from entity, model, and use-case names.
    infer_from:
      - CONTEXT.md or glossary entries
      - entity, model, aggregate, and use-case class or folder names
      - repeated vocabulary in README.md and ADRs

  - name: REPO_KNOWLEDGE_PATHS
    kind: both
    question: Which paths hold repository knowledge documents?
    fill_from: discovery
    recommend: Top-level knowledge/ plus existing authoritative project documentation such as docs/ and ADRs. Exclude MAINTENANCE_ROOT, installed Bootstrap/Maintainer bodies and resources, aliases, baselines, template snapshots, changelogs, and generated output before discovery or retrieval.
    infer_from:
      - knowledge/, docs/, adr/, rfc/, architecture/ folders
      - documentation paths referenced from README.md

  - name: TEST_STACK_CONVENTIONS
    kind: both
    question: Which test stack and conventions apply in the target repository?
    fill_from: discovery
    recommend: The test framework, assertion library, and mocking library already declared in the dependency manifest, plus the existing test file naming and folder layout.
    infer_from:
      - devDependencies, pytest.ini, *.csproj, build.gradle, go.mod
      - existing test folder layout and file naming
      - test setup helpers, fixtures, or factories

  - name: INTEGRATION_TEST_SCOPE
    kind: both
    question: What is in and out of scope for integration tests?
    fill_from: user
    recommend: Cover the repository's entry points with real internal wiring and stubbed third-party boundaries; keep unit-level logic and external vendor systems out of scope.
    infer_from:
      - existing integration or e2e test folders
      - test-host, fixture, or container setup helpers

  - name: OUTPUT_LANGUAGE
    kind: value
    question: Which language do generated agents answer in?
    fill_from: user
    recommend: The language the repository documentation is written in; English when documentation is mixed.
    infer_from:
      - language of README.md and docs/
      - language of recent commit messages and issue templates

  - name: PLANNER_SCOPE_RULES
    kind: block
    question: Which planning scope rules apply to the target repository?
    fill_from: user
    recommend: Plan only the current External Issue ID, keep changes inside the touched modules, and raise anything else as a follow-up instead of expanding the plan.
    infer_from:
      - CONTRIBUTING.md review rules
      - pull request template checklist
      - module or package boundaries in the repository layout

  - name: WORK_ITEM_ID_FORMAT
    kind: both
    question: What is the External Issue ID format and validation rule?
    fill_from: user
    recommend: "`#<number>` for GitHub Issues, `<PROJECT>-<number>` for Jira or Linear, and the local file stem for the Markdown adapter."
    infer_from:
      - resolved TRACKER_ADAPTER
      - issue references in recent commit messages and branch names

  - name: WORK_ITEM_PLANNING_CONTRACT
    kind: block
    question: Which work-item planning contract clauses apply to generated planning skills?
    fill_from: generator
    recommend: Keep the shipped contract wording; change it only with explicit user approval recorded in the manifest.
    infer_from: []

  - name: PLANNER_CLARIFICATION_WORKFLOW
    kind: block
    question: How does the generated Planner handle blocking clarifications?
    fill_from: generator
    recommend: Keep the shipped clarification workflow; change it only with explicit user approval recorded in the manifest.
    infer_from: []

  - name: PLANNER_HANDOFF_CHECKLIST
    kind: block
    question: What must the generated Planner hand off to Implementor?
    fill_from: generator
    recommend: Keep the shipped handoff checklist; change it only with explicit user approval recorded in the manifest.
    infer_from: []

  - name: REPO_NAME
    kind: value
    question: Which repository name should the root instructions announce?
    fill_from: discovery
    recommend: The name field of the package manifest; otherwise the git remote repository name.
    infer_from:
      - package.json, pyproject.toml, Cargo.toml, *.csproj
      - git remote origin path
      - repository folder name

  - name: AGENT_ROSTER
    kind: value
    question: Which generated agents should the root instructions route to?
    fill_from: generator
    recommend: One line per agent approved in the generation batch, naming the agent and the request type that should reach it.
    infer_from: []

  - name: AGENT_ROOT
    kind: value
    question: Where do generated agent files live?
    fill_from: user
    recommend: "`{{RUNTIME_ROOT}}/canonical/agents/` for complete canonical copies, plus the native agent root verified for this selected environment; share copies only when approved slot values agree."
    infer_from:
      - selected-environment documentation and existing native registration evidence
      - resolved TARGET_PLATFORM

  - name: SKILL_ROOT
    kind: value
    question: Where do generated repository skills live?
    fill_from: user
    recommend: One directly discoverable complete skill source when its neutral content, discovery and relative resources work for every consumer. Use environment-specific copies or native adapters only for a verified binding or discovery need; never share mixed client syntax.
    infer_from:
      - existing skill folders in the platform customization directory
      - resolved TARGET_PLATFORM

  - name: INSTRUCTION_ROOT
    kind: value
    question: Where do modular instruction files live?
    fill_from: user
    recommend: "`{{RUNTIME_ROOT}}/canonical/instructions/` as the shared canonical instruction location, plus the verified native scoping/discovery roots for selected environments."
    infer_from:
      - official selected-client instruction-loading documentation and existing scoped instructions
      - resolved TARGET_PLATFORM

  - name: RUNTIME_ROOT
    kind: value
    question: Which top-level folder holds the generated system's runtime resources (canonical copies, schemas, artifact gates, sessions, and a local issue folder)?
    fill_from: user
    recommend: "`.agentic-system/`, disjoint from `knowledge/`, the maintenance root, and application code. Runtime roles read it; it is never indexed as project knowledge. When a selected client cannot discover or read a hidden folder, propose the visible `agentic-system/` instead."
    infer_from:
      - top-level path collisions and existing session, schema, or issue folders
      - selected-client discovery, search, and file-access evidence for hidden folders
      - approved knowledge and maintenance roots

  - name: MAINTENANCE_ROOT
    kind: both
    question: Which dedicated top-level folder holds installation and maintenance material?
    fill_from: user
    recommend: "`.agentic-system-maintenance/`, disjoint from project knowledge, runtime discovery, documentation, and sessions. Ordinary requests must exclude it before search or loading; access only during initial Bootstrap or explicitly requested maintenance."
    infer_from:
      - existing manifest and answers locations for legacy migration
      - selected-client discovery and automatic loading evidence
      - top-level path collisions and approved runtime/session roots

  - name: MANIFEST_PATH
    kind: value
    question: Where is the agentic-system manifest stored?
    fill_from: user
    recommend: "`{{MAINTENANCE_ROOT}}/agentic-system-manifest.md`, accessed only during installation or explicit agent-system maintenance."
    infer_from:
      - resolved MAINTENANCE_ROOT

  - name: KNOWLEDGE_FILE_GLOB
    kind: value
    question: Which paths does the knowledge-file guard apply to?
    fill_from: user
    recommend: The glob covering the knowledge files listed in the knowledge index, for example `knowledge/**/*.md`, with maintenance-only roots excluded.
    infer_from:
      - folders holding the files listed in the knowledge index
      - top-level knowledge/ and existing authoritative project docs

