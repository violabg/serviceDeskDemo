<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design</title>
<style>
/* Tokens. Light is the default; dark follows the system unless the reader picked a theme. */
:root {
  --paper: #f6f7f9; --sheet: #ffffff; --tint: #eef1f5; --ink: #1c2430; --muted: #5d6777; --faint: #8a93a1;
  --rule: #d9dee5; --rule-strong: #2b3442; --ref: #2a59a6; --ref-soft: #e6edf8;
  --ok: #1d7a4e; --ok-soft: #e4f3eb; --warn: #9a5b00; --warn-soft: #fbf0dc; --err: #b42318; --err-soft: #fbe8e6;
  --flash: rgba(42, 89, 166, .16); --code-bg: #f1f3f6;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Iowan Old Style", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161c; --sheet: #181d24; --tint: #1f252e; --ink: #e3e7ed; --muted: #9ba4b2; --faint: #6f7886;
    --rule: #2a313c; --rule-strong: #c9d0da; --ref: #86acf0; --ref-soft: #1c2940;
    --ok: #5cc493; --ok-soft: #14291f; --warn: #e3a64b; --warn-soft: #30250f; --err: #f2867b; --err-soft: #361a17;
    --flash: rgba(134, 172, 240, .18); --code-bg: #1d232b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161c; --sheet: #181d24; --tint: #1f252e; --ink: #e3e7ed; --muted: #9ba4b2; --faint: #6f7886;
  --rule: #2a313c; --rule-strong: #c9d0da; --ref: #86acf0; --ref-soft: #1c2940;
  --ok: #5cc493; --ok-soft: #14291f; --warn: #e3a64b; --warn-soft: #30250f; --err: #f2867b; --err-soft: #361a17;
  --flash: rgba(134, 172, 240, .18); --code-bg: #1d232b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { --bar-h: 60px; }
html { scroll-padding-top: calc(var(--bar-h) + 24px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--ref); }
:focus-visible { outline: 2px solid var(--ref); outline-offset: 2px; border-radius: 3px; }
p { margin: 0 0 .8em; }
p:last-child { margin-bottom: 0; }
code, pre, .mono { font-family: var(--mono); }
code { font-size: .86em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
pre { margin: 0; font-size: 13px; line-height: 1.6; background: var(--code-bg); border-radius: 6px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
button { font: inherit; color: inherit; }

/* Title block: the design's identity and approval state, set like the title block of a drawing. */
/* The top bar stays in view: the design's title and the page tools. The facts below it scroll away. */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.topbar-inner { max-width: 1240px; height: var(--bar-h); margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 24px; }
.topbar h1 { flex: 1 1 auto; min-width: 0; font: 600 24px/1.2 var(--serif); margin: 0; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title-tools { display: flex; gap: 8px; flex: none; }
.title-block { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.title-inner { max-width: 1240px; margin: 0 auto; padding: 14px 24px 20px; display: grid; gap: 14px; }
.plan { color: var(--muted); font-size: 14px; }
.tool { background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.tool:hover { color: var(--ink); border-color: var(--muted); }
.fields { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.field { padding: 9px 14px 10px; border-left: 1px solid var(--rule); min-width: 0; }
.field:first-child { border-left: 0; }
.field dt { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.field dd { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.seal { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 4px; border: 1.5px solid currentColor; }
.seal.approved { color: var(--ok); background: var(--ok-soft); }
.seal.draft { color: var(--warn); background: var(--warn-soft); }
.bar { display: block; height: 4px; margin-top: 6px; border-radius: 2px; background: var(--tint); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); }
.bar.partial > span { background: var(--warn); }

/* Shell: the reading path on the left, one stage at a time on the right. */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 0 40px; padding: 0 24px; }
.path { position: sticky; top: var(--bar-h); align-self: start; max-height: calc(100vh - var(--bar-h)); overflow-y: auto; padding: 28px 0 40px; }
.path ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.path a { counter-increment: step; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 10px 8px 12px; border-left: 2px solid var(--rule); color: var(--muted); text-decoration: none; font-size: 15px; }
.path a::before { content: counter(step); font: 600 12px var(--mono); color: var(--faint); }
.path a:hover { color: var(--ink); background: var(--tint); }
.path a[aria-current="true"] { border-left-color: var(--ink); color: var(--ink); font-weight: 600; background: var(--sheet); }
.path a[aria-current="true"]::before { color: var(--ink); }
.path .count { font: 12px var(--mono); color: var(--faint); }
.path .count.warn { color: var(--warn); font-weight: 700; }
.path .count.err { color: var(--err); font-weight: 700; }
.path .count.ok { color: var(--ok); }

main { min-width: 0; padding: 32px 0 80px; }
.stage[hidden] { display: none; }
.stage-head { max-width: 46rem; margin-bottom: 8px; }
.stage-head h2 { font: 600 34px/1.15 var(--serif); margin: 0 0 12px; letter-spacing: -.01em; }
.stage-head .lead { font: 18px/1.6 var(--serif); color: var(--muted); }
.group-head { display: flex; align-items: baseline; gap: 12px; margin: 48px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.group-head h3 { font: 600 20px/1.3 var(--sans); margin: 0; }
.group-head .count { font: 13px var(--mono); color: var(--muted); }
.group-head p { margin: 0 0 0 auto; color: var(--muted); font-size: 14px; }

/* Items: one argument each. The ID sits in the margin, a strong rule opens every item. */
.item { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 0 24px; border-top: 2px solid var(--rule-strong); padding: 22px 0 34px; margin-top: 28px; scroll-margin-top: 12px; }
.group-head + .item { border-top-width: 0; margin-top: 4px; }
.item-id { font: 700 22px/1.2 var(--mono); }
.item-id a { color: var(--ink); text-decoration: none; position: sticky; top: calc(var(--bar-h) + 16px); display: inline-block; }
.item-id a:hover { color: var(--ref); }
.item-body { min-width: 0; max-width: 46rem; }
.item-body.wide { max-width: none; }
.item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 14px; }
.item-head h4 { font: 650 20px/1.35 var(--sans); margin: 0 6px 0 0; flex: 1 1 18rem; }
.statement { font: 20px/1.55 var(--serif); margin: 0 0 18px; }
.prose { font: 18px/1.68 var(--serif); }
.prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.3em; }
.prose li { margin-bottom: .25em; }
.anchored { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.anchored:first-child { border-top: 0; padding-top: 0; }
.prose > p + .anchored { margin-top: 12px; }
.anchored > a.idref { justify-self: start; align-self: start; margin-top: .3em; }
.anchored > p { margin: 0; }
.flash { animation: flash 1.8s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--tint); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.err { background: var(--err-soft); color: var(--err); }
.tag.ref { background: var(--ref-soft); color: var(--ref); }
.tag.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Inline references: IDs link to their item; element references carry their condition as a tooltip. */
a.idref { font: 600 .82em var(--mono); color: var(--ref); background: var(--ref-soft); padding: .05em .4em; border-radius: 4px; text-decoration: none; white-space: nowrap; }
a.idref:hover { text-decoration: underline; }
.sym { font: .86em var(--mono); color: var(--ink); border-bottom: 1px dotted var(--muted); cursor: help; }

/* Labelled facts inside an item. */
.facts { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 10px 18px; margin: 0 0 18px; }
.facts dt { font-size: 14px; font-weight: 600; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; min-width: 0; }
.facts dd.prose { font-size: 17px; line-height: 1.6; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.none { color: var(--faint); font-style: italic; }
.sub { font-size: 14px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; }

/* Decisions: the answer is the one thing to confirm. */
.question { font: 20px/1.55 var(--serif); margin: 0 0 18px; padding-left: 16px; border-left: 3px solid var(--ref); }
.answer { background: var(--ok-soft); border-left: 3px solid var(--ok); border-radius: 0 6px 6px 0; padding: 12px 16px; margin: 0 0 6px; }
.answer .sub { margin: 0 0 4px; color: var(--ok); }
.option { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 10px; font: 17.5px/1.55 var(--serif); }
.option + .option { margin-top: 8px; }
.option .mono { font-size: 13px; color: var(--muted); padding-top: 3px; }
.answer .option .mono { color: var(--ok); font-weight: 700; }
.others { padding: 4px 16px 0 19px; }

/* Edge cases of an operation, folded by default. */
details.edges { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
details.edges > summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: center; }
details.edges > summary::-webkit-details-marker { display: none; }
details.edges > summary::before { content: "\25b8"; color: var(--faint); transition: transform .15s ease; }
details.edges[open] > summary::before { transform: rotate(90deg); }
details.edges > summary .muted { font-weight: 400; color: var(--muted); }
.edges-body { padding: 4px 16px 16px; border-top: 1px solid var(--rule); }
.case { padding: 10px 0 10px 14px; border-left: 3px solid var(--rule); margin-top: 12px; }
.case.neg { border-left-color: var(--warn); }
.case.fault { border-left-color: var(--err); }
.case-title { font-weight: 600; margin-bottom: 6px; }
.case .facts { margin: 0; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 4px 14px; font-size: 14.5px; }

/* Tables for dense records. */
.table-wrap { overflow-x: auto; margin: 0 0 6px; }
table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
th { white-space: nowrap; text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); }
td { text-align: left; vertical-align: top; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); }
tr:last-child td { border-bottom: 0; }
.rule { font: 13px var(--mono); white-space: nowrap; }

/* Coverage and file summaries. */
.stats { display: flex; flex-wrap: wrap; gap: 12px 40px; margin: 22px 0 0; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.stat b { display: block; font: 600 26px/1.1 var(--serif); }
.stat span { font-size: 13px; color: var(--muted); }
.stat.ok b { color: var(--ok); }
.stat.warn b { color: var(--warn); }

/* Filesystem tree. */
.tree { margin-top: 28px; font-size: 15.5px; }
.tree details { margin: 0; }
.tree summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover { background: var(--tint); }
/* Open/close chevron: points right when closed, down when open. */
.tree summary::before { content: ""; flex: none; width: 9px; height: 9px; margin: 0 5px 0 3px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s ease; }
.tree details[open] > summary::before { transform: translate(0, -3px) rotate(45deg); }
.tree .folder > summary { font: 600 14.5px var(--mono); color: var(--ink); }
.tree .file > summary::before { width: 7px; height: 7px; border-width: 0 2px 2px 0; color: var(--muted); }
.tree .children { padding-left: 20px; border-left: 1px solid var(--rule); margin-left: 15px; }
.tree .file > summary { min-width: 0; }
.tree .file > summary .name { font: 15px var(--mono); flex: none; max-width: 70%; overflow-wrap: anywhere; }
.tree .file > summary .module { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--faint); }
.mark { font: 700 12px var(--mono); width: 14px; text-align: center; flex: none; }
.mark.A { color: var(--ok); }
.mark.M { color: var(--warn); }
.mark.D { color: var(--err); }
.tree .file > summary .fsid { font: 12px var(--mono); color: var(--faint); margin-left: auto; }
.tree .file-detail { padding: 6px 8px 18px 32px; }
.tree .file-detail .facts { margin: 0; }

/* Contracts. */
.sig { border-left: 3px solid var(--ref); }
.method { font: 700 13px var(--mono); color: var(--ref); background: var(--ref-soft); padding: 2px 8px; border-radius: 4px; }
.status-code { font: 700 13px var(--mono); }
.status-code.s2 { color: var(--ok); }
.status-code.s4 { color: var(--warn); }
.status-code.s5 { color: var(--err); }

/* Stage footer: where to go next. */
.stage-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); }
.stage-nav a { text-decoration: none; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.stage-nav a b { font: 600 18px var(--serif); color: var(--ref); }
.stage-nav a.next { text-align: right; margin-left: auto; }

.empty-state { margin-top: 28px; padding: 22px 0; border-top: 2px solid var(--rule); font: 17px/1.6 var(--serif); color: var(--muted); }
.clean { display: flex; gap: 12px; align-items: baseline; }

dialog { border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); color: var(--ink); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: 82vh; }
dialog::backdrop { background: rgba(10, 14, 20, .5); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--sheet); }
.dialog-head h2 { font: 600 20px var(--serif); margin: 0; }
.legend { padding: 8px 20px 20px; margin: 0; display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 0 18px; }
.legend dt, .legend dd { padding: 10px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.legend dt { font: 600 14px var(--mono); color: var(--ref); }
.legend dd { font-size: 14.5px; color: var(--muted); }

.template-note { max-width: 40rem; margin: 15vh auto; padding: 0 24px; }
.template-note h1 { font: 600 30px var(--serif); margin: 0 0 12px; }
.template-note p { font: 17px/1.6 var(--serif); color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding: 0 16px; }
  :root { --bar-h: 52px; }
  .topbar-inner { padding: 0 16px; gap: 12px; }
  .topbar h1 { font-size: 19px; }
  .tool { padding: 4px 10px; }
  .title-inner { padding: 12px 16px 16px; }
  .path { position: sticky; top: var(--bar-h); z-index: 3; max-height: none; padding: 0; margin: 0 -16px; background: var(--paper); border-bottom: 1px solid var(--rule); overflow-x: auto; }
  .path ol { display: flex; padding: 0 8px; }
  .path a { display: flex; gap: 6px; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; padding: 12px 10px 10px; }
  .path a[aria-current="true"] { border-bottom-color: var(--ink); background: transparent; }
  html { scroll-padding-top: calc(var(--bar-h) + 56px); }
  .item { grid-template-columns: minmax(0, 1fr); padding-top: 16px; scroll-margin-top: 4px; }
  .item-id { font-size: 17px; margin-bottom: 8px; }
  .item-id a { position: static; }
  .stage-head h2 { font-size: 28px; }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .facts dd { margin-bottom: 10px; }
  .group-head { flex-wrap: wrap; }
  .group-head p { margin: 0; flex-basis: 100%; }
  .legend { grid-template-columns: minmax(0, 1fr); }
  .legend dt { border-bottom: 0; padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; outline: 2px solid var(--ref); outline-offset: 6px; }
  details.edges > summary::before, .tree summary::before { transition: none; }
}
@media print {
  body { background: #fff; }
  .topbar { position: static; }
  .path, .title-tools, .stage-nav { display: none; }
  .shell { display: block; }
  .stage[hidden] { display: block; }
  .stage + .stage { break-before: page; }
  .item { break-inside: avoid-page; }
  .item-id a { position: static; }
  details.edges, .tree details { display: block; }
}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><h1 id="title">Design</h1>
  <div class="title-tools"><button class="tool" type="button" id="legend-open">Legend</button><button class="tool" type="button" id="theme">Theme</button></div></div></header>
<section class="title-block"><div class="title-inner" id="header"></div></section>
<div class="shell">
  <nav class="path" aria-label="Design sections"><ol id="path"></ol></nav>
  <main id="main"></main>
</div>
<dialog id="legend" aria-labelledby="legend-title">
  <div class="dialog-head"><h2 id="legend-title">How to read this design</h2><button class="tool" type="button" id="legend-close">Close</button></div>
  <dl class="legend" id="legend-body"></dl>
</dialog>
<script id="design-data" type="application/json">/*__DESIGN_DATA__*/null</script>
<script>
(function () {
  "use strict";
  const raw = document.getElementById("design-data").textContent;
  const data = raw.trim().slice(0, 2) === "/*" ? null : JSON.parse(raw);
  if (!data || !data.design) {
    // Opened as the bare template: the runtime inlines a design here when it renders design.html.
    document.body.innerHTML = '<div class="template-note"><h1>Design review template</h1>' +
      "<p>The runtime fills this file with a design when it renders design.html. Open the design.html of a session to review a design.</p></div>";
    return;
  }
  const design = data.design;
  const checks = data.checks;
  const path = design.path;

  // ---------- Helpers ----------
  const esc = (text) => String(text == null ? "" : text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const list = (value) => (Array.isArray(value) ? value : []);
  const when = (iso) => (iso ? String(iso).slice(0, 16).replace("T", " ") + " UTC" : "");
  const tag = (text, kind) => '<span class="tag ' + (kind || "") + '">' + esc(text) + "</span>";

  // Every ID in the design, mapped to the stage that shows it, so any mention can link to it.
  const stageOf = {};
  const elementText = {};
  design.decisions.forEach((d) => { stageOf[d.id] = "decisions"; list(d.options).forEach((o) => { if (o.id) stageOf[o.id] = "decisions"; }); });
  path.operations.forEach((o) => { stageOf[o.id] = "plan"; });
  path.filesystem.files.forEach((f) => { stageOf[f.id] = "filesystem"; });
  path.apis.forEach((a) => { stageOf[a.id] = "contracts"; });
  path.contracts.forEach((c) => { stageOf[c.id] = "contracts"; });
  design.obligations.forEach((o) => {
    stageOf[o.id] = "obligations";
    list(o.elements).forEach((e) => { stageOf[o.id + "." + e.id] = "obligations"; elementText[o.id + "." + e.id] = e.text; });
  });
  design.fileReferences.forEach((f) => { stageOf[f.id] = "file-references"; });
  design.iterations.forEach((i) => { stageOf[i.id] = "history"; });

  function idLink(id) {
    const tip = elementText[id] ? ' title="' + esc(elementText[id]) + '"' : "";
    return stageOf[id] ? '<a class="idref" href="#' + esc(id) + '"' + tip + ">" + esc(id) + "</a>" : '<span class="mono">' + esc(id) + "</span>";
  }
  function idLinks(ids) {
    const items = list(ids);
    return items.length ? '<span class="refs">' + items.map(idLink).join("") + "</span>" : '<span class="none">none</span>';
  }

  // Inline formatting: `code`, [name](path) symbols, **bold**, {{O#.k}} anchors and any known design ID.
  function inline(text) {
    return String(text == null ? "" : text).split(/(`[^`]+`)/).map((part, index) => {
      if (index % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      let html = esc(part);
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="sym" title="$2">$1</span>');
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\{\{(O\d+(?:\.\d+)?)\}\}/g, (_, ref) => idLink(ref));
      html = html.replace(/(^|[\s(,;:])((?:API|IM|FS|CT|FR|IT|D|O)\d+(?:\.\d+)?)(?=$|[\s),;:.])/g, (match, lead, ref) => (stageOf[ref] ? lead + idLink(ref) : match));
      return html;
    }).join("");
  }
  // Paragraphs on blank lines (or on single breaks when the text has no blank line); "- " lines become lists.
  // Text anchored with two or more {{O#.k}} placeholders is split so each anchor opens its own row.
  function prose(text, cls) {
    if (!text) return '<p class="none">Not recorded.</p>';
    const anchors = String(text).match(/\{\{O\d+(?:\.\d+)?\}\}/g) || [];
    if (anchors.length > 1) {
      const parts = String(text).split(/\s*(?=\{\{O\d+(?:\.\d+)?\}\})/);
      return '<div class="prose ' + (cls || "") + '">' + parts.map((part) => {
        const m = part.match(/^\{\{(O\d+(?:\.\d+)?)\}\}\s*([\s\S]*)$/);
        return m ? '<div class="anchored">' + idLink(m[1]) + "<p>" + inline(m[2]).replace(/\n/g, "<br>") + "</p></div>" : part.trim() ? "<p>" + inline(part).replace(/\n/g, "<br>") + "</p>" : "";
      }).join("") + "</div>";
    }
    const blocks = String(text).split(/\n{2,}/).length > 1 ? String(text).split(/\n{2,}/) : String(text).split(/\n/);
    return '<div class="prose ' + (cls || "") + '">' + blocks.map((block) => block.trim()).filter(Boolean).map((block) => {
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*[-*]\s+/.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("") + "</div>";
  }
  function facts(rows) {
    const kept = rows.filter((r) => r && r[1]);
    return kept.length ? '<dl class="facts">' + kept.map((r) => "<dt>" + esc(r[0]) + "</dt><dd" + (r[2] ? ' class="prose"' : "") + ">" + r[1] + "</dd>").join("") + "</dl>" : "";
  }
  // The margin shows design IDs only; section anchors such as "gaps" stay out of it.
  function item(id, head, body, wide) {
    const margin = /^[A-Z]+\d/.test(id) ? '<a href="#' + esc(id) + '">' + esc(id) + "</a>" : "";
    return '<article class="item" id="' + esc(id) + '"><div class="item-id">' + margin + "</div>" +
      '<div class="item-body' + (wide ? " wide" : "") + '">' + (head ? '<div class="item-head">' + head + "</div>" : "") + body + "</div></article>";
  }
  function groupHead(title, count, note) {
    return '<div class="group-head"><h3>' + esc(title) + '</h3><span class="count">' + count + "</span>" + (note ? "<p>" + esc(note) + "</p>" : "") + "</div>";
  }
  function table(headers, rows) {
    return '<div class="table-wrap"><table><thead><tr>' + headers.map((h) => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
      rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
  }
  const emptyState = (text) => '<p class="empty-state">' + esc(text) + "</p>";
  const changeMark = (change) => { const k = String(change || "").charAt(0).toUpperCase(); return '<span class="mark ' + k + '" title="' + esc(change) + '">' + esc(k) + "</span>"; };

  // ---------- Title block ----------
  const cov = checks.coverage;
  const pct = cov.elementsTotal ? Math.round((cov.elementsRealized / cov.elementsTotal) * 100) : 0;
  const approved = design.status === "Approved";
  const fields = [
    ["Status", '<span class="seal ' + (approved ? "approved" : "draft") + '">' + esc(design.status) + "</span>" + (design.modifiedAfterApproval ? " " + tag("changed after approval", "warn") : "")],
    approved && design.approvedAt ? ["Approved", esc(when(design.approvedAt))] : ["Last change", esc(when(design.updatedAt))],
    path.requirementRef ? ["Requirement", "<code>" + esc(path.requirementRef) + "</code>"] : null,
    ["Elements carried out", cov.elementsRealized + " of " + cov.elementsTotal + '<span class="bar' + (pct < 100 ? " partial" : "") + '"><span style="width:' + pct + '%"></span></span>'],
    ["Checks", checks.errors.length ? tag(checks.errors.length + (checks.errors.length === 1 ? " error" : " errors"), "err") + (checks.warnings.length ? " " + tag(checks.warnings.length + " warn.", "warn") : "")
      : checks.warnings.length ? tag(checks.warnings.length + (checks.warnings.length === 1 ? " warning" : " warnings"), "warn") : tag("clean", "ok")],
  ].filter(Boolean);
  const title = document.getElementById("title");
  title.textContent = path.title || design.designId;
  title.title = title.textContent;
  document.getElementById("header").innerHTML =
    (design.planName || design.planDescription ? '<div class="plan">' + (design.planName ? "Plan <code>" + esc(design.planName) + "</code>" : "") + (design.planDescription ? " " + inline(design.planDescription) : "") + "</div>" : "") +
    '<dl class="fields">' + fields.map((f) => '<div class="field"><dt>' + f[0] + "</dt><dd>" + f[1] + "</dd></div>").join("") + "</dl>";

  // ---------- Stages ----------
  const stages = [];
  function stage(id, title, lead, count, countKind, body) { stages.push({ id, title, lead, count, countKind, body }); }

  // Overview
  stage("overview", "Overview", "What the codebase does today, and what it is missing to satisfy the requirement.", null, "",
    item("current", "<h4>Current codebase</h4>", prose(design.overview.currentState)) +
    item("gaps", "<h4>Gaps to close</h4>", prose(design.overview.gaps)));

  // Decisions: blocking first, then highlights, then the rest by where the question came from.
  const sourceNames = { requirements: "From the requirement", requirement: "From the requirement", codebase: "From the codebase", internalreasoning: "From the agent's own reasoning" };
  const sourceKey = (d) => String(d.source || "internal reasoning").toLowerCase().replace(/[^a-z]/g, "");
  function decision(d) {
    const options = list(d.options);
    const chosen = options.filter((o) => o.chosen)[0];
    const others = options.filter((o) => o !== chosen);
    const option = (o) => '<div class="option"' + (o.id ? ' id="' + esc(o.id) + '"' : "") + '><span class="mono">' + esc(o.id || "") + "</span><div>" + inline(o.text) + "</div></div>";
    const head = "<h4>" + inline(d.topic) + "</h4>" + (d.blocking ? tag("blocking", "warn") : "") + (d.highlight ? tag("highlight", "ref") : "") + (d.source ? tag(d.source) : "");
    return item(d.id, head,
      (d.question ? '<p class="question">' + inline(d.question) + "</p>" : "") +
      facts([["Context", d.context && prose(d.context), true], ["Why it is asked", d.why && prose(d.why), true], ["How the answer is used", d.how && prose(d.how), true]]) +
      '<div class="answer"><div class="sub">' + (chosen ? "Answer" : "No answer chosen yet") + "</div>" + (chosen ? option(chosen) : "") + "</div>" +
      (others.length ? '<div class="sub">Other answers considered</div><div class="others">' + others.map(option).join("") + "</div>" : "") +
      '<div class="sub">Realized in</div>' + idLinks(d.realizedIn));
  }
  const blocking = design.decisions.filter((d) => d.blocking);
  const highlighted = design.decisions.filter((d) => !d.blocking && d.highlight);
  const rest = design.decisions.filter((d) => !d.blocking && !d.highlight);
  const bySource = {};
  rest.forEach((d) => { (bySource[sourceKey(d)] = bySource[sourceKey(d)] || []).push(d); });
  const sourceOrder = ["requirements", "requirement", "codebase", "internalreasoning"].concat(Object.keys(bySource).filter((k) => !sourceNames[k]));
  stage("decisions", "Decisions", "Each decision is a question the design had to answer. Confirm the answer, or name another option by its ID to change it.",
    design.decisions.length, blocking.length ? "warn" : "",
    design.decisions.length
      ? (blocking.length ? groupHead("Blocking", blocking.length, "Answer these before implementation starts.") + blocking.map(decision).join("") : "") +
        (highlighted.length ? groupHead("Highlights", highlighted.length, "About the situation rather than the solution. Read them first.") + highlighted.map(decision).join("") : "") +
        sourceOrder.filter((k) => bySource[k]).map((k) => groupHead(sourceNames[k] || bySource[k][0].source, bySource[k].length) + bySource[k].map(decision).join("")).join("")
      : emptyState("No decisions recorded yet."));

  // Implementation plan
  function statusTag(status) {
    if (status === "Completed") return tag("Completed", "ok dot");
    if (status === "InProgress") return tag("In progress", "ref dot");
    return tag("Not started", "dot");
  }
  function edges(op) {
    const branches = list(op.branches), negatives = list(op.negatives), faults = list(op.exceptions);
    if (!branches.length && !negatives.length && !faults.length) return "";
    const parts = [];
    if (branches.length) parts.push(branches.length + (branches.length === 1 ? " branch" : " branches"));
    if (negatives.length) parts.push(negatives.length + (negatives.length === 1 ? " negative case" : " negative cases"));
    if (faults.length) parts.push(faults.length + (faults.length === 1 ? " fault" : " faults"));
    return '<details class="edges"><summary>Edge cases <span class="muted">' + esc(parts.join(", ")) + '</span></summary><div class="edges-body">' +
      branches.map((b) => '<div class="case"><div class="case-title">' + inline(b.question) + "</div>" + facts([
        ["Yes", b.yes && ((b.yes.label ? "<strong>" + inline(b.yes.label) + "</strong> " : "") + inline(b.yes.note))],
        ["No", b.no && ((b.no.label ? "<strong>" + inline(b.no.label) + "</strong> " : "") + inline(b.no.note))],
        ["Why", b.why && inline(b.why)]]) + "</div>").join("") +
      negatives.map((n) => '<div class="case neg"><div class="case-title">' + inline(n.cause) + "</div>" + facts([
        ["Behavior", inline(n.behavior)], ["Impact", n.impact && tag(n.impact, n.impact === "High" ? "err" : n.impact === "Medium" ? "warn" : "")]]) + "</div>").join("") +
      faults.map((x) => '<div class="case fault"><div class="case-title">' + inline(x.trigger) + "</div>" + facts([["Recovery", inline(x.recovery)]]) + "</div>").join("") +
      "</div></details>";
  }
  const opsDone = path.operations.filter((o) => o.implementationStatus === "Completed").length;
  stage("plan", "Implementation plan", path.operationsIntro || "The operations an implementor carries out, in order.",
    path.operations.length, "",
    (path.operations.length ? '<div class="stats"><div class="stat"><b>' + path.operations.length + "</b><span>operations</span></div>" +
      '<div class="stat' + (opsDone === path.operations.length ? " ok" : "") + '"><b>' + opsDone + "</b><span>completed</span></div></div>" : "") +
    (path.operations.length ? path.operations.map((op) => item(op.id,
      "<h4>" + inline(op.operation) + "</h4>" + tag(op.kind, "ref") + statusTag(op.implementationStatus) + (op.source && op.source !== "design" ? tag("from " + op.source) : ""),
      prose(op.instructions) + '<div style="height:18px"></div>' +
      facts([
        ["Source reference", op.sourceRef && inline(op.sourceRef)],
        ["Depends on", list(op.dependsOn).length && idLinks(op.dependsOn)],
        ["Carries out", idLinks(list(op.refObligations).concat(list(op.refElements)))],
        ["Files", list(op.files).length ? list(op.files).map((f) => "<code>" + esc(f) + "</code>").join(" ") : '<span class="none">none</span>'],
      ]) + edges(op))).join("") : emptyState("No operations scheduled yet.")));

  // Filesystem: a folder tree; each file opens to its reason, change and impact.
  const fsFiles = path.filesystem.files;
  const root = { folders: {}, files: [] };
  fsFiles.forEach((f) => {
    const parts = String(f.path).split(/[\\/]+/).filter(Boolean);
    let node = root;
    parts.slice(0, -1).forEach((name) => { node = node.folders[name] = node.folders[name] || { folders: {}, files: [] }; });
    node.files.push({ name: parts[parts.length - 1] || f.path, file: f });
  });
  // Folders with a single child folder and no files collapse into one row (a/b/c/).
  function fsNode(node) {
    return Object.keys(node.folders).sort().map((name) => {
      let label = name, child = node.folders[name];
      while (!child.files.length && Object.keys(child.folders).length === 1) { const next = Object.keys(child.folders)[0]; label += "/" + next; child = child.folders[next]; }
      return '<details class="folder" open><summary>' + esc(label) + '/</summary><div class="children">' + fsNode(child) + "</div></details>";
    }).join("") + node.files.sort((a, b) => a.name.localeCompare(b.name)).map((entry) => {
      const f = entry.file;
      return '<details class="file" id="' + esc(f.id) + '"><summary>' + changeMark(f.status) + '<span class="name">' + esc(entry.name) + "</span>" +
        (f.module ? '<span class="module" title="' + esc(f.module) + '">' + esc(f.module) + "</span>" : "") + '<span class="fsid">' + esc(f.id) + "</span></summary>" +
        '<div class="file-detail">' + facts([["Path", "<code>" + esc(f.path) + "</code>"], ["Reason", prose(f.reason), true], ["Change", prose(f.change), true], ["Impact", prose(f.impact), true]]) + "</div></details>";
    }).join("");
  }
  const added = fsFiles.filter((f) => f.status === "Added").length;
  stage("filesystem", "Filesystem", path.filesystem.intro || "The files the design adds or modifies. Open a file to see why it changes.",
    fsFiles.length, "",
    fsFiles.length
      ? '<div class="stats"><div class="stat"><b>' + (fsFiles.length - added) + "</b><span>modified</span></div>" +
        '<div class="stat"><b>' + added + "</b><span>added</span></div>" +
        '<div class="stat"><b>' + new Set(fsFiles.map((f) => f.module).filter(Boolean)).size + "</b><span>modules touched</span></div></div>" +
        '<div class="tree">' + fsNode(root) + "</div>"
      : emptyState("No files declared yet."));

  // Contracts
  const statusClass = (s) => { const c = String(s || "").trim().charAt(0); return c === "2" ? "s2" : c === "4" ? "s4" : c === "5" ? "s5" : ""; };
  const confidence = (x) => (x.confidence ? tag("confidence " + x.confidence, x.confidence === "Low" ? "warn" : "") : "") + (x.evidence ? tag("evidence " + x.evidence, x.evidence === "None" ? "warn" : "") : "");
  const apis = path.apis.map((a) => item(a.id,
    '<span class="method">' + esc(a.method) + "</span><h4><code>" + esc(a.path) + "</code></h4>" + confidence(a),
    '<p class="statement">' + inline(a.purpose) + "</p>" + facts([["Authorization", a.auth && inline(a.auth)]]) +
    '<div class="sub">Request</div><pre class="sig">' + esc(a.request || "") + "</pre>" +
    (list(a.responses).length ? '<div class="sub">Responses</div>' + table(["Status", "Meaning", "Body"], list(a.responses).map((r) =>
      ['<span class="status-code ' + statusClass(r.status) + '">' + esc(r.status) + "</span>", inline(r.description), r.body ? "<code>" + esc(r.body) + "</code>" : ""])) : ""), true)).join("");
  const internal = path.contracts.map((c) => item(c.id,
    "<h4>" + esc(c.module || c.id) + "</h4>" + (c.type ? tag(c.type, "ref") : "") + confidence(c),
    (c.file ? "<p><code>" + esc(c.file) + "</code></p>" : "") + '<p class="statement">' + inline(c.promises) + "</p>" +
    '<div class="sub">Signature</div><pre class="sig">' + esc(c.signature || "") + "</pre>" +
    (list(c.premortem).length ? '<div class="sub">What could break it</div>' + table(["Risk", "Mitigation"], list(c.premortem).map((m) => [inline(m.what), inline(m.mitigation)])) : "") +
    (c.evidenceNote ? '<div class="sub">Evidence</div>' + prose(c.evidenceNote) : ""), true)).join("");
  stage("contracts", "Contracts", "What each module promises, with its full signature, and every public endpoint the design exposes.",
    path.apis.length + path.contracts.length, "",
    groupHead("Public APIs", path.apis.length) + (apis || emptyState("The design exposes no HTTP endpoint.")) +
    groupHead("Internal contracts", path.contracts.length) + (internal || emptyState("No internal contracts recorded.")));

  // Obligations
  const carried = {};
  path.operations.forEach((op) => list(op.refElements).concat(list(op.refObligations)).forEach((r) => { (carried[r] = carried[r] || []).push(op.id); }));
  const obligationDone = (o) => (list(o.elements).length ? list(o.elements).every((e) => carried[o.id + "." + e.id]) : Boolean(carried[o.id]));
  stage("obligations", "Obligations", "The behaviors the requirement demands. Each one is split into elements that the operations must carry out.",
    design.obligations.length, design.obligations.some((o) => !obligationDone(o)) ? "warn" : "",
    (design.obligations.length
      ? '<div class="stats"><div class="stat ' + (cov.obligationsRealized === cov.obligationsTotal ? "ok" : "warn") + '"><b>' + cov.obligationsRealized + " / " + cov.obligationsTotal + "</b><span>obligations realized</span></div>" +
        '<div class="stat ' + (cov.elementsRealized === cov.elementsTotal ? "ok" : "warn") + '"><b>' + cov.elementsRealized + " / " + cov.elementsTotal + "</b><span>elements carried out</span></div></div>" +
        design.obligations.map((o) => {
          const els = list(o.elements);
          const ops = {};
          els.forEach((e) => list(carried[o.id + "." + e.id]).forEach((id) => { ops[id] = true; }));
          list(carried[o.id]).forEach((id) => { ops[id] = true; });
          return item(o.id,
            (o.origin === "Developer" ? tag("decided by the developer", "ref") : tag("from the requirement")) + (obligationDone(o) ? tag("realized", "ok") : tag("not realized", "warn")),
            '<p class="statement">' + inline(o.behavior) + "</p>" +
            facts([["Applies to", o.class && inline(o.class)], ["Boundaries", o.boundaries && inline(o.boundaries)], ["Source in R", o.sourceRef && "<em>" + inline(o.sourceRef) + "</em>"], ["Carried out by", Object.keys(ops).length && idLinks(Object.keys(ops))]]) +
            (els.length ? '<div class="sub">Elements</div>' + table(["Element", "Kind", "Condition", "Carried out by"], els.map((e) => {
              const ref = o.id + "." + e.id;
              return ['<span class="mono" id="' + esc(ref) + '">' + esc(ref) + "</span>", tag(e.kind), inline(e.text), carried[ref] ? idLinks(carried[ref]) : tag("open", "warn")];
            })) : ""), true);
        }).join("")
      : emptyState("No obligations recorded yet.")));

  // File references
  stage("file-references", "File references", "The symbols the implementation needs, with existing files that already use them as examples.",
    design.fileReferences.length, "",
    design.fileReferences.length ? design.fileReferences.map((fr) => item(fr.id,
      '<h4><code>' + esc(fr.symbol) + "</code></h4>",
      list(fr.files).map((f) => {
        const d = list(fr.details).filter((x) => String(x.path).toLowerCase() === String(f).toLowerCase())[0];
        return '<div class="sub"><code>' + esc(f) + "</code></div>" +
          (d ? facts([["Why it is a reference", inline(d.why)], ["Use in this work", inline(d.purpose)]]) : "<p>" + tag("no detail recorded", "warn") + "</p>");
      }).join(""))).join("") : emptyState("No file references recorded yet."));

  // History
  stage("history", "History", "Each implementation iteration: what was asked, what changed, and how it was verified.",
    design.iterations.length, "",
    design.iterations.length ? design.iterations.map((it) => item(it.id,
      (it.status === "Closed" ? tag("Closed", "ok dot") : tag("Open", "ref dot")) + '<span style="color:var(--muted);font-size:14px">' + esc(when(it.createdAt)) + (it.closedAt ? " to " + esc(when(it.closedAt)) : "") + "</span>",
      '<p class="statement">' + inline(it.request) + "</p>" +
      (list(it.files).length ? '<div class="sub">Files changed</div>' + table(["", "Path"], list(it.files).map((f) => [changeMark(f.change), "<code>" + esc(f.path) + "</code>" + (f.detail ? "<br>" + inline(f.detail) : "")])) : "") +
      (list(it.verifications).length ? '<div class="sub">Verifications</div>' + table(["Kind", "Name", "Outcome"], list(it.verifications).map((v) => [tag(v.kind), inline(v.name), inline(v.outcome)])) : "") +
      (list(it.blocks).length ? '<div class="sub">Blocks</div>' + list(it.blocks).map((b) => '<div class="case neg">' + inline(typeof b === "string" ? b : JSON.stringify(b)) + "</div>").join("") : "") +
      (it.notes ? '<div class="sub">Notes</div>' + prose(it.notes) : ""), true)).join("") : emptyState("No implementation iteration yet."));

  // Checks
  const findings = checks.errors.map((f) => [tag("error", "err"), '<span class="rule">' + esc(f.rule) + "</span>", stageOf[f.element] ? idLink(f.element) : '<span class="mono">' + esc(f.element) + "</span>", inline(f.detail)])
    .concat(checks.warnings.map((f) => [tag("warning", "warn"), '<span class="rule">' + esc(f.rule) + "</span>", stageOf[f.element] ? idLink(f.element) : '<span class="mono">' + esc(f.element) + "</span>", inline(f.detail)]));
  stage("checks", "Checks", "Mechanical facts about the design: missing links, unrealized elements, crowded anchors. They do not judge whether the design is right.",
    checks.errors.length + checks.warnings.length || "✓", checks.errors.length ? "err" : checks.warnings.length ? "warn" : "ok",
    findings.length
      ? '<div style="margin-top:28px">' + table(["Severity", "Rule", "Where", "Detail"], findings) + "</div>"
      : '<p class="empty-state clean">' + tag("clean", "ok") + " No mechanical findings. Every element is carried out and every link resolves.</p>");

  // ---------- Assemble ----------
  const main = document.getElementById("main");
  main.innerHTML = stages.map((s, i) => {
    const prev = stages[i - 1], next = stages[i + 1];
    return '<section class="stage" id="' + s.id + '" data-stage="' + s.id + '" aria-labelledby="' + s.id + '-title" hidden>' +
      '<div class="stage-head"><h2 id="' + s.id + '-title">' + esc(s.title) + "</h2>" + (s.lead ? '<div class="lead">' + inline(s.lead) + "</div>" : "") + "</div>" + s.body +
      '<nav class="stage-nav" aria-label="Previous and next section">' +
      (prev ? '<a href="#' + prev.id + '">Previous<b>' + esc(prev.title) + "</b></a>" : "") +
      (next ? '<a class="next" href="#' + next.id + '">Next<b>' + esc(next.title) + "</b></a>" : "") + "</nav></section>";
  }).join("");
  document.getElementById("path").innerHTML = stages.map((s) =>
    '<li><a href="#' + s.id + '" data-to="' + s.id + '"><span>' + esc(s.title) + "</span>" +
    (s.count !== null && s.count !== undefined ? '<span class="count ' + s.countKind + '">' + esc(s.count) + "</span>" : "<span></span>") + "</a></li>").join("");

  // ---------- Navigation: the hash names a stage or any ID; the stage holding it is shown. ----------
  function show(hash, scroll) {
    const id = decodeURIComponent(hash.replace(/^#/, ""));
    let target = id && document.getElementById(id);
    let section = target && target.closest ? target.closest("section.stage") : null;
    if (!section) { section = document.querySelector("section.stage"); target = null; }
    document.querySelectorAll("section.stage").forEach((s) => { s.hidden = s !== section; });
    document.querySelectorAll(".path a").forEach((a) => a.setAttribute("aria-current", String(a.dataset.to === section.id)));
    const current = document.querySelector('.path a[aria-current="true"]');
    if (current && current.scrollIntoView) current.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (!scroll) return;
    if (!target || target === section) { window.scrollTo(0, 0); return; }
    if (target.tagName === "DETAILS") target.open = true;
    for (let p = target.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
    const box = target.closest(".item, tr, details.file") || target;
    box.scrollIntoView({ block: "start" });
    box.classList.remove("flash");
    void box.offsetWidth;
    box.classList.add("flash");
  }
  window.addEventListener("hashchange", () => show(location.hash, true));
  show(location.hash, Boolean(location.hash));

  // ---------- Legend ----------
  const legend = [
    ["R", "The functional requirement. Everything in the design is anchored to it."],
    ["O#", "An obligation: one behavior R demands, or one the developer declared."],
    ["O#.k", "An element: a condition of an obligation that can be checked on its own. Operations carry elements out."],
    ["D#", "A decision: a question the design had to answer, with the chosen answer and the other options."],
    ["D#.k", "An option of a decision. Name one by its ID to make it the answer."],
    ["Blocking", "A decision that must be answered before implementation starts."],
    ["Highlight", "A decision about the situation, such as a missing input or process, rather than about the code."],
    ["IM#", "An operation: one ordered step of the implementation plan."],
    ["FS#", "A file the design adds (A) or modifies (M)."],
    ["CT#", "An internal contract: what a module promises, with its signature."],
    ["API#", "A public HTTP endpoint, with its request and responses."],
    ["FR#", "A file reference: a symbol the work needs, with files that already use it."],
    ["IT#", "An implementation iteration, recorded in the history."],
  ];
  document.getElementById("legend-body").innerHTML = legend.map((r) => "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>").join("");
  const dialog = document.getElementById("legend");
  document.getElementById("legend-open").addEventListener("click", () => { if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", ""); });
  document.getElementById("legend-close").addEventListener("click", () => { if (dialog.close) dialog.close(); else dialog.removeAttribute("open"); });
  dialog.addEventListener("click", (event) => { if (event.target === dialog && dialog.close) dialog.close(); });

  // ---------- Theme toggle (remembered per browser when storage is available) ----------
  const rootEl = document.documentElement;
  try { const saved = localStorage.getItem("design-theme"); if (saved === "light" || saved === "dark") rootEl.setAttribute("data-theme", saved); } catch (e) {}
  document.getElementById("theme").addEventListener("click", () => {
    const current = rootEl.getAttribute("data-theme");
    const dark = current ? current === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    try { localStorage.setItem("design-theme", next); } catch (e) {}
  });
})();
</script>
</body>
</html>
