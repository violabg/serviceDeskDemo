# Project Codex configuration (trusted projects only). Generated by agent-system maintenance 2026-10-11.
# GitHub issue access uses the GitHub MCP server; the bearer token is read from GITHUB_TOKEN in Codex's
# process environment and is never stored here. Custom demo roles narrow this in .codex/agents/*.toml.
# issue_write serves only the explicitly invoked manage-work-item skill in the default agent.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"
enabled_tools = ["issue_read", "issue_write"]
