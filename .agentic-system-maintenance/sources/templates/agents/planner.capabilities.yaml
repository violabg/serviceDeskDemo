# Generated by sync:canonical-agents from the upstream source of planner.agent.md. Do not edit by hand.
# Bootstrap-only capability evidence: read during discovery to resolve this role's
# CAPABILITY_BINDINGS slot. It never requires the original service or a named replacement.
agent: planner.agent.md
capabilities:
  - token: execution-report-read
    substitute: Read `{{SESSION_ROOT}}/<planning-session-id>/execution-report.md`.
  - token: implementation-plan-list
    substitute: List the implementation plans already present in the current Planning Session folder.
  - token: implementation-plan-load
    substitute: Open the existing implementation plan in the current Planning Session folder and edit it in place.
  - token: implementation-plan-save
    substitute: Save the implementation plan to its path in the current Planning Session folder.
  - token: implementation-plan-schema
    substitute: Read `{{PLAN_SCHEMA_PATH}}` and obey it as the plan contract.
  - token: knowledge-document-read
    substitute: Read the knowledge document the index points to.
  - token: knowledge-index-read
    substitute: Read `{{KNOWLEDGE_INDEX_PATH}}` and select entries by their `When to read` triggers.
  - token: knowledge-index-rebuild
    substitute: Rebuild `{{KNOWLEDGE_INDEX_PATH}}` from the approved knowledge source using the knowledge-retrieval and file-editing capabilities declared in `registry/capabilities.yaml`, within this role's knowledge-operation scope.
  - token: repository-search
    substitute: Use the repository-search capability declared in `registry/capabilities.yaml`.
  - token: session-activate
    substitute: Create or resume the current Planning Session folder under `{{SESSION_ROOT}}`. Session identity is a directory, not a service.
  - token: session-artifact-list
    substitute: List `{{SESSION_ROOT}}/<planning-session-id>/artifacts/`.
  - token: session-artifact-read
    substitute: Read `{{SESSION_ROOT}}/<planning-session-id>/artifacts/<artifact-name>.md`.
  - token: session-artifact-write
    substitute: Write `{{SESSION_ROOT}}/<planning-session-id>/artifacts/<artifact-name>.md`.
  - token: session-event-log
    substitute: Append the event to `{{SESSION_ROOT}}/<planning-session-id>/session-log.md`. Keep event history separate from session memory summaries.
  - token: session-list
    substitute: Read only the current Planning Session folder under `{{SESSION_ROOT}}`. Never enumerate other sessions.
  - token: session-memory-append
    substitute: Append to `{{SESSION_ROOT}}/<planning-session-id>/session-memory.md`, newest entry last.
  - token: session-memory-read
    substitute: Read `{{SESSION_ROOT}}/<planning-session-id>/session-memory.md`.
  - token: wiki-catalog-read
    substitute: List the available wikis through the approved knowledge-retrieval capability declared in `registry/capabilities.yaml`.
  - token: wiki-page-list
    substitute: List pages in the selected wiki through the approved knowledge-retrieval capability declared in `registry/capabilities.yaml`.
  - token: wiki-page-read
    substitute: Read the selected wiki page through the approved knowledge-retrieval capability declared in `registry/capabilities.yaml`.
  - token: work-item-batch-retrieval
    substitute: Use `{{WORK_ITEM_RETRIEVAL}}` to retrieve the provided work item IDs as a batch.
  - token: work-item-comment-retrieval
    substitute: Use `{{WORK_ITEM_RETRIEVAL}}` to read the work item comments.
  - token: work-item-retrieval
    substitute: Use `{{WORK_ITEM_RETRIEVAL}}` for the requested External Issue ID.
  - token: work-item-type-retrieval
    substitute: Use `{{WORK_ITEM_RETRIEVAL}}` to determine the work item type.
tooling_intent:
  - category: Work-item tracker access
    tokens:
      - work-item-batch-retrieval
      - work-item-comment-retrieval
      - work-item-retrieval
      - work-item-type-retrieval
    guidance: Read issue, story, type, or comment evidence. Seek a read-only target tracker integration or the local tracker fallback.
  - category: Repository knowledge access
    tokens:
      - knowledge-document-read
      - knowledge-index-read
      - knowledge-index-rebuild
    guidance: Read or maintain repository knowledge. Prefer the generated knowledge index and repository documents; consider a configured documentation source only when it improves this role's workflow.
  - category: Wiki knowledge access
    tokens:
      - wiki-catalog-read
      - wiki-page-list
      - wiki-page-read
    guidance: Discover and read wiki knowledge through an approved read-only documentation source. Preserve catalog, page-listing, and page-reading operations; do not require the upstream plugin or tracker service.
  - category: Repository discovery
    tokens:
      - repository-search
    guidance: Perform bounded code and symbol discovery. Use approved repository search when available; otherwise use native workspace file/path and text search to identify candidate files and terms without requiring cluster metadata or an MCP.
  - category: Planning-session persistence
    tokens:
      - execution-report-read
      - implementation-plan-list
      - implementation-plan-load
      - implementation-plan-save
      - implementation-plan-schema
      - session-activate
      - session-artifact-list
      - session-artifact-read
      - session-artifact-write
      - session-event-log
      - session-list
      - session-memory-append
      - session-memory-read
    guidance: Persist and exchange session artifacts. Prefer repository-local session files and generated contracts; do not add an MCP only for storage unless target evidence requires one.
